name: Deploy to GitHub Pages

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *" # Every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)

# Concurrency is per job, not per workflow: a workflow-level cancel would also
# kill `verify`, and superseded main pushes (~29% of them) would get no test
# result at all. Data and build jobs stay latest-wins; deploys queue so an in-flight Pages
# deployment is never killed; `verify` always finishes.

permissions:
  contents: read
  # The GHCR package inventory feeds /factory/images and /factory/userspace.
  # The default token is repository-scoped, so listing an organisation's
  # packages can still fail; fetch-ghcr-packages.js falls back to anonymous
  # reads of the public registry when it does.
  packages: read

jobs:
  # Fetches every data file once, so all build parts render the same data.
  data:
    name: Fetch site data
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-data-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      locales: ${{ steps.plan.outputs.locales }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Same key as the cron workflows, so main already holds this entry.
      # No restore-keys: a partial hit still runs `npm ci`, which deletes
      # node_modules first, so restoring a stale tree is wasted download.
      - name: Restore node_modules
        id: cache-node-modules
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # No `cache: npm`: ~/.npm only helps a node_modules miss, and restoring
      # it costs ~3s on every hit.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      # Saved immediately after install, before the build writes the rspack
      # persistent cache into node_modules/.cache — that state is known to
      # corrupt (see `just clear`) and must never be archived. PR and merge
      # queue saves are scoped to refs no other run can read, so skip them.
      - name: Save node_modules
        if: >-
          steps.cache-node-modules.outputs.cache-hit != 'true' &&
          github.event_name != 'pull_request' &&
          github.event_name != 'merge_group'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: node_modules
          key: ${{ steps.cache-node-modules.outputs.cache-primary-key }}

      - name: Restore GitHub data cache
        # Caches only gitignored files produced by fetch scripts. Git-tracked
        # seeds (SBOM attestations, images, driver-versions, firehose-apps,
        # artwork*, countme/scorecard/update-churn history, gnome-extensions)
        # are excluded so a stale cache entry never overwrites committed data.
        # github-profiles and hive-history have their own dedicated caches.
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            static/data/brew-analytics.json
            static/data/dora.json
            static/data/factory-stats.json
            static/data/file-contributors.json
            static/data/flathub-stats.json
            static/data/ghcr-packages.json
            static/data/github-repos.json
            static/data/playlist-metadata.json
            static/data/portal-contributors.json
            static/data/registry-data.json
            static/data/test-runs.json
            static/data/hive-live-data.json
          key: github-data-${{ hashFiles('scripts/fetch-*.js', 'scripts/fetch-*.mjs') }}
          restore-keys: |
            github-data-

      - name: Restore GitHub profiles cache
        # Populated by update-github-profiles-cache.yml in a separate workflow.
        # Primary key never matches; restore-keys fetches the latest entry.
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: static/data/github-profiles.json
          key: github-profiles-v1-${{ github.run_id }}
          restore-keys: |
            github-profiles-v1-

      - name: Restore Hive history cache
        # Populated by update-hive-cache.yml every 2 hours.
        # Primary key never matches; restore-keys fetches the latest entry.
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: static/data/hive-history.json
          key: hive-history-${{ github.run_id }}
          restore-keys: |
            hive-history-

      - name: Restore SBOM attestation cache
        id: sbom-cache
        # Populated by update-sbom-cache.yml nightly at 04:00 UTC.
        # Primary key never matches; restore-keys fetches the latest entry.
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            static/data/sbom-attestations.json
            static/data/sbom-attestations-frontend.json
          key: github-data-sbom-v2-${{ github.run_id }}
          restore-keys: |
            github-data-sbom-v2-

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install oras
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
      - name: Fetch SBOM on cache miss
        if: steps.sbom-cache.outputs.cache-matched-key == ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/fetch-github-sbom.js

      - name: Check SBOM data freshness
        run: node scripts/check-sbom-staleness.js

      - name: Fetch data
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Always re-fetch image metadata on every build so hasAttestation,
          # versions, and security info stay current. IMAGES_REFRESH_HOURS: "0"
          # forces the per-product inner cache to also refresh (it defaults to
          # 336h and would otherwise serve stale nvidia tag data from GHA cache).
          IMAGES_CACHE_HOURS: "0"
          IMAGES_REFRESH_HOURS: "0"
          # Always re-fetch driver versions on every build so GNOME/kernel/mesa
          # versions stay current. The data is small (GitHub API call) and the
          # script's internal 168h TTL would otherwise serve stale cached data.
          DRIVER_VERSIONS_CACHE_HOURS: "0"
          # Always re-fetch firehose app data on every build so the changelogs
          # page shows current releases. The committed seed is an empty array;
          # without this the cache check sees a fresh mtime and skips the fetch.
          FIREHOSE_CACHE_HOURS: "0"
          # Always re-fetch hive live data (Guardians, Ghosts, PRs, stats) on
          # every build so the factory dashboard shows current GitHub state.
          HIVE_LIVE_CACHE_HOURS: "0"
          # Always re-fetch public hive registry data (tasks, heartbeat, health)
          # on every build so the leaderboard shows current task completions.
          REGISTRY_CACHE_HOURS: "0"
        run: npm run fetch-data

      # One job per build part: English, plus translated locales in shards of
      # up to 4 (scripts/build-site.mjs). Locales build one after another in a
      # single Docusaurus process, so this keeps build time flat as
      # translations go live instead of adding ~10s per locale.
      - name: Plan build parts
        id: plan
        run: |
          echo "matrix=$(node scripts/build-site.mjs --matrix)" >> "$GITHUB_OUTPUT"
          echo "locales=$(node scripts/build-site.mjs --list-locales)" >> "$GITHUB_OUTPUT"

      - name: Upload site data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-data
          path: |
            static/data/*.json
            static/feeds/*.json
          retention-days: 1

  build:
    name: Build ${{ matrix.part }}
    needs: data
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-build-${{ matrix.part }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      matrix: ${{ fromJSON(needs.data.outputs.matrix) }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      # Full history: `future.faster` enables gitEagerVcs, which dates any
      # undated doc/blog file from git; a shallow clone would give it HEAD's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Restore node_modules
        id: cache-node-modules
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Download site data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: site-data
          path: static

      # English carries every static asset; translated builds link to it.
      - name: Restore card image cache
        if: matrix.part == 'en'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            static/img/cards
            static/data/card-hashes.json
          key: card-images-${{ hashFiles('scripts/generate-card-images.mjs', 'scripts/lib/card-template.mjs', 'static/data/sbom-attestations-frontend.json') }}
          restore-keys: |
            card-images-

      - name: Generate embeddable card images
        if: matrix.part == 'en'
        run: npm run generate-card-images

      # Fetch the current upstream night wallpaper; JXL needs djxl, November
      # SVG is rasterized by Resvg, and cwebp writes the companion preview.
      - name: Install social image tools
        if: matrix.part == 'en'
        run: sudo apt-get install -y --no-install-recommends libjxl-tools webp || (sudo apt-get update && sudo apt-get install -y --no-install-recommends libjxl-tools webp)

      - name: Generate social preview card
        if: matrix.part == 'en'
        run: npm run generate-social-cards -- --strict

      # Tests and lint run in the parallel `verify` job. Typecheck needs the
      # gitignored static/data/*.json that src/ imports, so it runs here.
      - name: Typecheck
        if: matrix.part == 'en'
        run: npm run typecheck

      - name: Build website (${{ matrix.part }})
        run: npm run build:ci -- --part ${{ matrix.part }}

      - name: Upload build part
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-${{ strategy.job-index }}
          path: build
          include-hidden-files: true # build/.nojekyll
          retention-days: 1

  # Merges the parts into one site. Runs on PRs too, so the merge is exercised
  # before it ever reaches a deploy; only main uploads the Pages artifact.
  assemble:
    name: Assemble site
    needs: [data, build]
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Download build parts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: site-*
          merge-multiple: true
          path: build

      # A shard whose upload went missing would otherwise deploy a site with a
      # locale silently absent.
      - name: Check every locale is present
        env:
          LOCALES: ${{ needs.data.outputs.locales }}
        run: |
          test -f build/index.html
          test -f build/.nojekyll
          for locale in $LOCALES; do
            test -f "build/$locale/index.html" || { echo "::error::missing build/$locale"; exit 1; }
          done
          echo "assembled en + [${LOCALES}]"

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: build

  # Runs beside `build` instead of ahead of it. `npm test` and eslint need no
  # fetched data, so they come off the build's critical path; deploy still
  # waits on both jobs. No concurrency group: every commit gets a result.
  verify:
    name: Unit tests and lint
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Restore node_modules
        id: cache-node-modules
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/lcov.info
          retention-days: 30

      # prettier-lint is advisory (~100 files already fail; see AGENTS.md).
      - name: Run lint (+ advisory prettier)
        run: |
          (npm run prettier-lint || true) & prettier_pid=$!
          status=0
          npm run lint || status=1
          wait "$prettier_pid"
          exit "$status"

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: [assemble, verify]
    concurrency:
      group: ${{ github.workflow }}-deploy-${{ github.ref }}
      cancel-in-progress: false

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
