name: Refresh SBOM Seed Files

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # Pushes and PRs use the mergeraptor app token (#1625), so the built-in
  # token only reads.
  contents: read
  packages: read

jobs:
  refresh-sbom-seed:
    name: Fetch fresh SBOM data and open PR
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Install oras
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Fetch fresh SBOM attestation data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run fetch-sbom

      - name: Validate SBOM data is non-empty
        run: |
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('static/data/sbom-attestations.json', 'utf8'));
            const count = Object.values(data.streams || {}).reduce((acc, s) => acc + Object.keys(s.releases || {}).length, 0);
            console.log('Total releases in SBOM data:', count);
            if (count === 0) { console.error('ERROR: SBOM data is empty'); process.exit(1); }
          "

      - name: Generate mergeraptor app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.MERGERAPTOR_APP_ID }}
          private-key: ${{ secrets.MERGERAPTOR_PRIVATE_KEY }}

      - name: Create PR with updated seed files
        env:
          # An app token, not github.token: GitHub starts no CI for PRs or pushes
          # made with the built-in token (#1625).
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          BRANCH="chore/sbom-seed-$(date +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add static/data/sbom-attestations.json static/data/sbom-attestations-frontend.json
          if git diff --cached --quiet; then
            echo "No changes to SBOM seed files — nothing to PR."
            exit 0
          fi
          git commit -m "chore(sbom): refresh SBOM attestation seed files from projectbluefin"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/projectbluefin/documentation"
          git push origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(sbom): refresh SBOM attestation seed files" \
            --body "Automated refresh of the committed SBOM seed files from current projectbluefin image data. These seed files are last-resort fallbacks used when the GHA cache is cold."
