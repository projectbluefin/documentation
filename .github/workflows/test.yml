name: Unit Tests

# The root scripts/ suite runs in pages.yml's `verify` job (with coverage
# thresholds) on every PR, push, merge_group and dispatch, so it is not
# repeated here. This workflow keeps only the suites that glob cannot reach.
on:
  # No paths filter: filtering meant a red main was never re-verified, and a
  # broken gate that never fires cost us #1276 (#1288).
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # workers/knowledge-mcp ships its own suite that the root `npm test` glob
  # (`scripts/**/*.test.js`, rooted at the repository root, .js only) can never
  # reach, and no workflow ran it (#1289). It imports only node: builtins and
  # its own src/, so it needs no install.
  knowledge-mcp:
    name: Run workers/knowledge-mcp tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/knowledge-mcp
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Run knowledge-mcp unit tests
        run: npm test
