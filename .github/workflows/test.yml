name: Unit Tests

on:
  # No paths filter. The scripts/ suite reads and executes files under src/
  # (portal-brand-icons.test.js loads PortalPrototype.tsx; seven other suites
  # assert on src/components/** and src/css/**), so a src/-only change could
  # break it without the gate ever running. Filtering also meant a red main
  # was never re-verified. A no-op run on an unrelated change costs a minute;
  # a broken gate that never fires cost us #1276 (#1288).
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run scripts unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run unit tests
        run: npm test

  # workers/knowledge-mcp ships its own suite that the root `npm test` glob
  # (`scripts/**/*.test.js`, rooted at the repository root, .js only) can never
  # reach, and no workflow ran it (#1289). It imports only node: builtins and
  # its own src/, so it needs no install.
  knowledge-mcp:
    name: Run workers/knowledge-mcp tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/knowledge-mcp
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Run knowledge-mcp unit tests
        run: npm test
