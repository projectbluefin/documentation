name: CI\non:\n  push:\n    branches: [main]\n  pull_request:\n    branches: [main]\n\njobs:\n  build:\n    runs-on: ubuntu-latest\n\n    steps:\n    - uses: actions/checkout@v3\n    - name: Set up Node.js\n      uses: actions/setup-node@v3\n      with:\n        node-version: 18\n    - run: npm install\n    - run: npm test\n    - name: Check for BLUEFIN_DISCUSSIONS_TOKEN\n      run: |\n        if [ -z "${{ secrets.BLUEFIN_DISCUSSIONS_TOKEN }}" ]; then\n          echo "BLUEFIN_DISCUSSIONS_TOKEN is not configured" >&2\n          exit 1\n        fi
