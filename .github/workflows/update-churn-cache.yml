name: Update Release Churn Cache

on:
  push:
    branches:
      - main
    paths:
      - "static/data/sbom-attestations.json"
      - "static/data/sbom-attestations-frontend.json"
  schedule:
    - cron: "0 5 * * *" # 05:00 UTC daily (1 hour after 04:00 UTC nightly SBOM update)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # Pushes and PRs use the mergeraptor app token (#1625), so the built-in
  # token only reads.
  contents: read
  packages: read

jobs:
  update-churn-cache:
    name: Compute release update churn and create PR
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"

      - name: Compute release update churn
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run fetch-update-churn -- --force

      - name: Check for churn dataset changes
        id: check-changes
        run: |
          git add static/data/update-churn.json
          if git diff --cached --quiet; then
            echo "No update churn changes detected."
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "Update churn dataset changed."
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Generate mergeraptor app token
        if: steps.check-changes.outputs.changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.MERGERAPTOR_APP_ID }}
          private-key: ${{ secrets.MERGERAPTOR_PRIVATE_KEY }}

      - name: Create or update PR with fresh churn data
        if: steps.check-changes.outputs.changed == 'true'
        env:
          # An app token, not github.token: GitHub starts no CI for PRs or pushes
          # made with the built-in token (#1625).
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          BRANCH="chore/update-churn-$(date +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -m "chore(analytics): update release churn statistics"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/projectbluefin/documentation"
          git push -u origin "$BRANCH" --force

          # Check if PR already exists before opening duplicate
          EXISTING_PR=$(gh pr list --repo projectbluefin/documentation --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING_PR" ]; then
            echo "PR #$EXISTING_PR already exists for $BRANCH — skipping creation."
          else
            gh pr create \
              --repo projectbluefin/documentation \
              --base main \
              --head "$BRANCH" \
              --title "chore(analytics): update release churn statistics" \
              --body "Automated update of release-over-release update churn, layer reuse efficiency, and zstd compression statistics triggered by updated SBOMs and OCI manifests. The hive merges it once the site build and tests pass."
          fi
