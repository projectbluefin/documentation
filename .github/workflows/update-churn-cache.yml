name: Update Release Churn Cache

on:
  push:
    branches:
      - main
    paths:
      - "static/data/sbom-attestations.json"
      - "static/data/sbom-attestations-frontend.json"
  schedule:
    - cron: "0 5 * * *" # 05:00 UTC daily (1 hour after 04:00 UTC nightly SBOM update)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  packages: read

jobs:
  update-churn-cache:
    name: Compute release update churn and create PR
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Compute release update churn
        run: npm run fetch-update-churn -- --force

      - name: Check for churn dataset changes
        id: check-changes
        run: |
          git add static/data/update-churn.json
          if git diff --cached --quiet; then
            echo "No update churn changes detected."
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "Update churn dataset changed."
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create or update PR with fresh churn data
        if: steps.check-changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="chore/update-churn-$(date +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -m "chore(analytics): update release churn statistics"
          git push -u origin "$BRANCH" --force

          # Check if PR already exists before opening duplicate
          EXISTING_PR=$(gh pr list --repo projectbluefin/documentation --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING_PR" ]; then
            echo "PR #$EXISTING_PR already exists for $BRANCH — skipping creation."
          else
            gh pr create \
              --repo projectbluefin/documentation \
              --base main \
              --head "$BRANCH" \
              --title "chore(analytics): update release churn statistics" \
              --body "Automated update of release-over-release update churn, layer reuse efficiency, and zstd compression statistics triggered by updated SBOMs and OCI manifests. Requires maintainer approval before merge per repository policy."
          fi
