name: Update Contributor Metrics Cache

on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC daily
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: read
  discussions: read

jobs:
  update-contributor-metrics:
    name: Compute contributor metrics and create PR
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26"

      - name: Verify collector offline
        run: node --test scripts/fetch-contributor-metrics.test.js

      - name: Retain the newest verified refresh awaiting review
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync, spawnSync } = require('node:child_process');
          const ref = 'refs/remotes/origin/chore/update-contributor-metrics';
          const found = spawnSync('git', ['show-ref', '--verify', '--quiet', ref]);
          if (found.status === 1) process.exit(0);
          if (found.status !== 0) throw new Error('Could not inspect the pending refresh branch');
          const file = 'static/data/contributor-metrics.json';
          const pending = JSON.parse(execFileSync('git', ['show', `${ref}:${file}`], { encoding: 'utf8' }));
          const current = JSON.parse(fs.readFileSync(file, 'utf8'));
          const stamp = Date.parse(pending.generatedAt);
          if (pending.schemaVersion === 2 && pending.coverage?.complete === true &&
              Number.isFinite(stamp) && stamp <= Date.now() &&
              stamp > (Date.parse(current.generatedAt) || 0)) {
            fs.writeFileSync(file, JSON.stringify(pending, null, 2) + '\n');
          }
          NODE

      - name: Compute contributor metrics
        id: collect
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "startedAt=$(node -e 'console.log(Date.now())')" >> "$GITHUB_OUTPUT"
          node scripts/fetch-contributor-metrics.js --force

      - name: Check for contributor metrics dataset changes
        id: check-changes
        run: |
          git add static/data/contributor-metrics.json
          if git diff --cached --quiet; then
            echo "No contributor metrics changes detected."
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "Contributor metrics dataset changed."
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create or update PR with fresh contributor data
        if: steps.check-changes.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="chore/update-contributor-metrics"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -m "chore(analytics): refresh public contributor participation"
          git push -u origin "$BRANCH" --force-with-lease

          # Check if PR already exists before opening duplicate
          EXISTING_PR=$(gh pr list --repo projectbluefin/documentation --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING_PR" ]; then
            echo "PR #$EXISTING_PR already exists for $BRANCH — skipping creation."
          else
            gh pr create \
              --repo projectbluefin/documentation \
              --base main \
              --head "$BRANCH" \
              --title "chore(analytics): refresh public contributor participation" \
              --body "Refreshes the complete public GitHub participation snapshot. Known bots and imported fork commit history are excluded; failed collection preserves last-good history and marks unavailability. Requires maintainer approval before merge."
          fi

      # Publish the unavailable state first, then report a failed refresh honestly.
      # The build-facing fetcher still exits zero and preserves the last-good data.
      - name: Require a verified current refresh
        env:
          SCAN_STARTED_AT: ${{ steps.collect.outputs.startedAt }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { isVerifiedRefresh } = require('./scripts/fetch-contributor-metrics');
          const snapshot = JSON.parse(fs.readFileSync('static/data/contributor-metrics.json', 'utf8'));
          if (!isVerifiedRefresh(snapshot, Number(process.env.SCAN_STARTED_AT), Date.now())) {
            console.error('Scheduled contributor refresh did not produce a complete current snapshot. Last-good data is retained.');
            process.exitCode = 1;
          }
          NODE
