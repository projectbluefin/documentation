name: Generate Monthly Report

on:
  schedule:
    # Every Monday at 10:00 UTC; the gate job below lets only the first Monday
    # of the month proceed. POSIX cron ORs day-of-month with day-of-week, so
    # "0 10 1-7 * 1" would fire on days 1-7 *and* every Monday.
    - cron: "0 10 * * 1"
  workflow_dispatch: # Allow manual triggering for testing

permissions:
  contents: write # For git commits
  pull-requests: write # For creating PRs

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - name: Allow only the first Monday of the month on schedule
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ] || [ "$(date -u +%-d)" -le 7 ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not the first Monday of the month; skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

  generate-report:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Generate monthly report
        id: generate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run fetch-countme -- --force
          npm run fetch-flathub-stats -- --force
          npm run generate-report

      - name: Create feature branch
        run: |
          BRANCH_NAME="monthly-report/$(date +%Y-%m)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Use -B to force-reset branch if it already exists from a prior failed run
          git checkout -B "$BRANCH_NAME"

      - name: Commit changes to branch
        run: |
          mapfile -t REPORT_FILES < <(
            git status --short --untracked-files=all |
              awk '$2 ~ /^blog\/.*\.mdx$/ {print $2}'
          )
          if [ "${#REPORT_FILES[@]}" -ne 1 ]; then
            echo "Expected exactly one generated blog report, found ${#REPORT_FILES[@]}"
            printf '%s\n' "${REPORT_FILES[@]}"
            exit 1
          fi
          git add "${REPORT_FILES[0]}" \
            scripts/data/report-history.json \
            scripts/data/known-contributors.json \
            static/data/countme-history.json
          git diff --staged --quiet || git commit -m "docs(reports): add monthly report for $(date +%B\ %Y)"

      - name: Push branch and create PR
        run: |
          BRANCH_NAME="monthly-report/$(date +%Y-%m)"
          # Re-add credentials for the push (persist-credentials: false on checkout)
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}"
          TODAY=$(date +%Y-%m-%d)
          # --force is safe here because the workflow always resets the branch with
          # git checkout -B, and actions/checkout shallow clones don't track the
          # remote branch state, causing --force-with-lease to fail on re-runs.
          git push -u origin "$BRANCH_NAME" --force
          # Only create the PR if one doesn't already exist for this branch
          if ! gh pr view "$BRANCH_NAME" --json number --jq '.number' > /dev/null 2>&1; then
            gh pr create \
              --title "docs(reports): Monthly report for $(date +%B\ %Y)" \
              --body "$(cat <<EOFBODY
          ## Automated Monthly Report

          This PR contains the automated monthly report generated on ${TODAY}.

          ### Contents
          - Monthly activity summary
          - Contributor statistics
          - Project updates

          ### Automated Checks
          - [ ] Build passes
          - [ ] No lint errors
          - [ ] Report renders correctly

          **Note:** This PR was automatically generated by the monthly-reports workflow.
          EOFBODY
          )" \
              --base main \
              --head "$BRANCH_NAME"
          else
            echo "PR already exists for $BRANCH_NAME — skipping creation"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
